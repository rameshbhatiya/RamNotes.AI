<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RamNotes AI | Dynamic Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding-bottom: 70px; }

        .app-header { background: #1e1b4b; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #4338ca; position: sticky; top: 0; z-index: 100; }
        .app-header .title { font-size: 18px; font-weight: 700; cursor: pointer; }
        
        .nav-back-btn { background: #334155; color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }

        .main-container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .page-view { display: none; }
        .page-view.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 10px; }
        .card-menu { background: #1e293b; border-radius: 16px; padding: 24px 15px; text-align: center; border: 1px solid #334155; cursor: pointer; transition: all 0.2s; }
        .card-menu:hover { border-color: #6366f1; transform: translateY(-3px); }
        .card-menu i { font-size: 38px; margin-bottom: 12px; }
        .card-menu h4 { font-size: 15px; color: #f1f5f9; }

        .form-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-top: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 14px; border: 1px solid #334155; border-radius: 10px; background: #0f172a; color: white; outline: none; font-size: 14px; }
        .btn-submit { width: 100%; padding: 13px; border: none; border-radius: 10px; background: linear-gradient(90deg, #6366f1, #4f46e5); color: white; font-weight: 600; cursor: pointer; }

        .content-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .content-body { background: #0f172a; padding: 16px; border-radius: 8px; font-size: 14px; line-height: 1.7; color: #e2e8f0; white-space: pre-wrap; margin-top: 12px; border: 1px solid #334155; }

        /* ATTRACTIVE QUIZ STYLES */
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #0f172a; padding: 12px 16px; border-radius: 10px; border: 1px solid #334155; }
        .quiz-progress-bar { width: 100%; height: 8px; background: #0f172a; border-radius: 10px; overflow: hidden; margin-bottom: 15px; border: 1px solid #334155; }
        .quiz-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #10b981); transition: width 0.3s ease; }
        .question-title { font-size: 16px; font-weight: 600; color: #f8fafc; margin-bottom: 15px; line-height: 1.5; }
        
        .option-btn { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 10px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; text-align: left; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .option-btn:hover { border-color: #6366f1; background: #1e293b; }
        
        .option-btn.correct { background: #064e3b !important; border-color: #10b981 !important; color: #a7f3d0 !important; animation: pop 0.2s ease; }
        .option-btn.wrong { background: #7f1d1d !important; border-color: #ef4444 !important; color: #fecaca !important; animation: shake 0.3s ease; }

        @keyframes pop { 0% { transform: scale(0.98); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .loader-spinner { text-align: center; padding: 30px 10px; color: #818cf8; font-size: 15px; }
        .dev-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #090d16; padding: 10px; text-align: center; border-top: 1px solid #1e293b; font-size: 13px; color: #60a5fa; font-weight: 600; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="title" onclick="showPage('homePage')"><i class="fa-solid fa-graduation-cap"></i> RamNotes AI</div>
        <button class="nav-back-btn" onclick="showPage('homePage')"><i class="fa-solid fa-house"></i> Main Dashboard</button>
    </div>

    <div class="main-container">

        <!-- DASHBOARD -->
        <div id="homePage" class="page-view active">
            <h3 style="margin-bottom: 15px; color:#818cf8;">Select Module</h3>
            <div class="dashboard-grid">
                <div class="card-menu" onclick="showPage('booksPage')">
                    <i class="fa-solid fa-book-open" style="color: #818cf8;"></i>
                    <h4>NCERT Books & Notes</h4>
                </div>
                <div class="card-menu" onclick="showPage('solutionsPage')">
                    <i class="fa-solid fa-file-signature" style="color: #f59e0b;"></i>
                    <h4>NCERT Solutions</h4>
                </div>
                <div class="card-menu" onclick="showPage('doubtPage')">
                    <i class="fa-solid fa-robot" style="color: #10b981;"></i>
                    <h4>AI Doubt Solver</h4>
                </div>
                <div class="card-menu" onclick="showPage('quizPage')">
                    <i class="fa-solid fa-gamepad" style="color: #ef4444;"></i>
                    <h4>Dynamic AI Quiz</h4>
                </div>
            </div>
        </div>

        <!-- BOOKS & NOTES -->
        <div id="booksPage" class="page-view">
            <h3 style="color:#818cf8;">📚 NCERT Books & Chapter Notes</h3>
            <div class="form-card">
                <div class="form-group">
                    <label>Step 1: Select Class</label>
                    <select id="bookClass" class="form-control" onchange="loadSubjects('bookClass', 'bookSubject', 'bookChapter')"></select>
                </div>
                <div class="form-group">
                    <label>Step 2: Select Subject</label>
                    <select id="bookSubject" class="form-control" onchange="loadChapters('bookClass', 'bookSubject', 'bookChapter')"></select>
                </div>
                <div class="form-group">
                    <label>Step 3: Select Chapter</label>
                    <select id="bookChapter" class="form-control"></select>
                </div>
                <button class="btn-submit" onclick="fetchAIContent('notes')">Get Complete Notes from AI</button>
            </div>
            <div id="bookResult"></div>
        </div>

        <!-- SOLUTIONS -->
        <div id="solutionsPage" class="page-view">
            <h3 style="color:#f59e0b;">💡 NCERT Textbook Solutions</h3>
            <div class="form-card">
                <div class="form-group">
                    <label>Step 1: Select Class</label>
                    <select id="solClass" class="form-control" onchange="loadSubjects('solClass', 'solSubject', 'solChapter')"></select>
                </div>
                <div class="form-group">
                    <label>Step 2: Select Subject</label>
                    <select id="solSubject" class="form-control" onchange="loadChapters('solClass', 'solSubject', 'solChapter')"></select>
                </div>
                <div class="form-group">
                    <label>Step 3: Select Chapter</label>
                    <select id="solChapter" class="form-control"></select>
                </div>
                <button class="btn-submit" style="background: linear-gradient(90deg, #f59e0b, #d97706);" onclick="fetchAIContent('solution')">Get Step-by-Step Answer Key</button>
            </div>
            <div id="solutionResult"></div>
        </div>

        <!-- AI DOUBT -->
        <div id="doubtPage" class="page-view">
            <h3 style="color:#10b981;">🤖 Live AI Doubt Solver</h3>
            <div class="form-card">
                <div class="form-group">
                    <label>Enter your Question / Doubt in detail:</label>
                    <textarea id="doubtInput" class="form-control" style="height: 110px;" placeholder="Type your doubt here..."></textarea>
                </div>
                <button class="btn-submit" style="background: linear-gradient(90deg, #10b981, #059669);" onclick="solveAIDoubt()">Solve Doubt via AI</button>
            </div>
            <div id="doubtResult"></div>
        </div>

        <!-- CLASS/SUBJECT WISE AI QUIZ PAGE -->
        <div id="quizPage" class="page-view">
            <h3 style="color:#ef4444; margin-bottom: 10px;">🎮 AI Generated Quiz (20 Marks)</h3>
            
            <div class="form-card" id="quizSelectCard">
                <div class="form-group">
                    <label>Step 1: Select Class</label>
                    <select id="quizClass" class="form-control" onchange="loadSubjects('quizClass', 'quizSubject', 'quizChapter')"></select>
                </div>
                <div class="form-group">
                    <label>Step 2: Select Subject</label>
                    <select id="quizSubject" class="form-control" onchange="loadChapters('quizClass', 'quizSubject', 'quizChapter')"></select>
                </div>
                <div class="form-group">
                    <label>Step 3: Select Chapter</label>
                    <select id="quizChapter" class="form-control"></select>
                </div>
                <button class="btn-submit" style="background: linear-gradient(90deg, #ef4444, #dc2626);" onclick="generateDynamicQuiz()">Start Dynamic AI Quiz</button>
            </div>

            <!-- ACTIVE QUIZ CONTAINER -->
            <div id="activeQuizArea" style="display: none; margin-top: 15px;">
                <div class="quiz-progress-bar">
                    <div class="quiz-progress-fill" id="quizProgress"></div>
                </div>

                <div class="quiz-header">
                    <span id="quizQuestionCount" style="font-size: 13px; font-weight: 600; color: #818cf8;">Question 1 / 20</span>
                    <span id="quizScore" style="font-size: 13px; font-weight: 700; color: #10b981;">Score: 0 / 20</span>
                </div>

                <div class="form-card" id="quizQuestionCard">
                    <div class="question-title" id="questionText">Loading...</div>
                    <div id="optionsContainer"></div>
                </div>
            </div>
        </div>

    </div>

    <div class="dev-footer">Developed with ❤️ by Ramesh Kumawat</div>

    <script>
        const ncertDatabase = {
            "12": {
                "English (Vistas)": ["The Third Level", "The Tiger King", "Journey to the end of the Earth", "The Enemy", "On the face of It", "Memories of Childhood"],
                "English (Flamingo)": ["The Last Lesson", "Lost Spring", "Deep Water", "The Rattrap", "Indigo", "Poets and Pancakes", "The Interview", "Going Places"],
                "Physics": ["Electric Charges and Fields", "Electrostatic Potential", "Current Electricity", "Moving Charges and Magnetism", "Ray Optics", "Wave Optics", "Atoms", "Nuclei", "Semiconductor Electronics"],
                "Chemistry": ["Solutions", "Electrochemistry", "Chemical Kinetics", "d and f Block Elements", "Coordination Compounds", "Amines"],
                "Mathematics": ["Relations and Functions", "Inverse Trigonometry", "Matrices", "Determinants", "Integrals", "Vector Algebra", "3D Geometry", "Probability"]
            },
            "11": {
                "Physics": ["Units and Measurements", "Motion in a Straight Line", "Laws of Motion", "Work, Energy and Power"],
                "Chemistry": ["Basic Concepts of Chemistry", "Structure of Atom", "Chemical Bonding"],
                "Mathematics": ["Sets", "Relations and Functions", "Trigonometry", "Complex Numbers"]
            },
            "10": {
                "Science": ["Chemical Reactions", "Acids, Bases and Salts", "Life Processes", "Control and Coordination", "Electricity"],
                "Mathematics": ["Real Numbers", "Polynomials", "Quadratic Equations", "Triangles", "Trigonometry"],
                "Social Science": ["Development", "Sectors of Indian Economy", "Resource and Development"]
            },
            "9": {
                "Science": ["Matter in Our Surroundings", "Atoms and Molecules", "Cell - The Fundamental Unit of Life", "Motion"],
                "Mathematics": ["Number Systems", "Polynomials", "Lines and Angles", "Triangles"]
            },
            "8": {
                "Science": ["Crop Production", "Microorganisms", "Coal and Petroleum", "Force and Pressure", "Light"],
                "Mathematics": ["Rational Numbers", "Linear Equations", "Square and Square Roots"],
                "Social Science": ["Resources", "The Indian Constitution"],
                "English": ["The Best Christmas Present", "The Tsunami"],
                "Hindi": ["ध्वनि", "लाख की चूड़ियाँ", "बस की यात्रा"]
            },
            "7": {
                "Science": ["Nutrition in Plants", "Heat", "Acids, Bases and Salts", "Light"],
                "Mathematics": ["Integers", "Fractions and Decimals", "Simple Equations"],
                "Social Science": ["Environment", "Inside Our Earth", "On Equality"],
                "English (Poorvi/Honeycomb)": ["Three Questions", "A Gift of Chappals"],
                "Hindi (Malhar/Vasant)": ["हम पंछी उन्मुक्त गगन के", "दादी माँ"],
                "Sanskrit": ["सुभाषितानि", "दुर्बुद्धिः विनश्यति"]
            },
            "6": {
                "Science": ["Components of Food", "Sorting Materials", "Electricity and Circuits", "Magnets"],
                "Mathematics": ["Knowing Our Numbers", "Whole Numbers", "Integers", "Fractions"],
                "Social Science": ["What, Where, How and When?", "The Earth in Solar System"],
                "English": ["Who Did Patrick's Homework?", "Taro's Reward"],
                "Hindi": ["वह चिड़िया जो", "बचपन"],
                "Sanskrit": ["शब्दपरिचयः I", "शब्दपरिचयः II"]
            }
        };

        function showPage(pageId) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        function initDropdowns() {
            ['bookClass', 'solClass', 'quizClass'].forEach(classId => {
                const select = document.getElementById(classId);
                select.innerHTML = '';
                for(let cls in ncertDatabase) {
                    select.innerHTML += `<option value="${cls}">Class ${cls}</option>`;
                }
            });
            loadSubjects('bookClass', 'bookSubject', 'bookChapter');
            loadSubjects('solClass', 'solSubject', 'solChapter');
            loadSubjects('quizClass', 'quizSubject', 'quizChapter');
        }

        function loadSubjects(classId, subjectId, chapterId) {
            const cls = document.getElementById(classId).value;
            const subSelect = document.getElementById(subjectId);
            subSelect.innerHTML = '';
            const subjects = Object.keys(ncertDatabase[cls] || {});
            subjects.forEach(sub => subSelect.innerHTML += `<option value="${sub}">${sub}</option>`);
            loadChapters(classId, subjectId, chapterId);
        }

        function loadChapters(classId, subjectId, chapterId) {
            const cls = document.getElementById(classId).value;
            const sub = document.getElementById(subjectId).value;
            const chapSelect = document.getElementById(chapterId);
            chapSelect.innerHTML = '';
            const chapters = (ncertDatabase[cls] && ncertDatabase[cls][sub]) || [];
            chapters.forEach(chap => chapSelect.innerHTML += `<option value="${chap}">${chap}</option>`);
        }

        // Helper function for API Payload matching FastAPI requirements (Fixes 422 Unprocessable Entity)
        function createPayload(cls, sub, chap, promptText) {
            return JSON.stringify({
                level: `Class ${cls}`,
                subject: sub,
                chapter: chap,
                body: promptText,
                prompt: promptText
            });
        }

        function parseAIText(data) {
            if (typeof data === 'string') return data;
            if (data.text) return data.text;
            if (data.result) return data.result;
            if (data.response) return data.response;
            if (data.choices && data.choices[0]) return data.choices[0].text || data.choices[0].message?.content;
            return JSON.stringify(data);
        }

        async function fetchAIContent(mode) {
            const isNotes = mode === 'notes';
            const cls = document.getElementById(isNotes ? 'bookClass' : 'solClass').value;
            const sub = document.getElementById(isNotes ? 'bookSubject' : 'solSubject').value;
            const chap = document.getElementById(isNotes ? 'bookChapter' : 'solChapter').value;

            const resDiv = document.getElementById(isNotes ? 'bookResult' : 'solutionResult');
            resDiv.innerHTML = `
                <div class="content-card">
                    <h4>📌 Class ${cls} - ${sub}: ${chap}</h4>
                    <div class="content-body">⏳ Connecting to AI... Generating Content...</div>
                </div>
            `;

            const promptStr = isNotes 
                ? `Provide complete NCERT textbook notes, main summary, key formulas, and 5 important questions with answers for Class ${cls}, Subject: ${sub}, Chapter: ${chap}.`
                : `Provide step-by-step NCERT Solutions and Answer Key for Class ${cls}, Subject: ${sub}, Chapter: ${chap}.`;

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: createPayload(cls, sub, chap, promptStr)
                });
                const data = await res.json();
                resDiv.querySelector('.content-body').innerText = parseAIText(data);
            } catch(e) {
                resDiv.querySelector('.content-body').innerText = "Unable to fetch response from API.";
            }
        }

        async function solveAIDoubt() {
            const query = document.getElementById('doubtInput').value.trim();
            if(!query) return alert('Please enter your question.');

            const resDiv = document.getElementById('doubtResult');
            resDiv.innerHTML = `
                <div class="content-card">
                    <h4>🤖 Question: ${query}</h4>
                    <div class="content-body">⏳ Thinking...</div>
                </div>
            `;

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: createPayload("General", "General", "Doubt", query)
                });
                const data = await res.jso
